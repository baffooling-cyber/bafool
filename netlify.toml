[build]
  publish = "public"
  # data.js (1 MB of rosters) lives in public/; the build checks it against this fingerprint
  command = "test -s public/data.js || curl -fsSL https://runthetablenfl.com/data.js -o public/data.js; echo '7fba3bb48b02a4c1595643f2605b4da8e14fabc30b1a01a23d9ee49277336c4f  public/data.js' | sha256sum -c -"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
